[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["prasanth-chadaram"]
repository = "https://github.com/prasanth-chadaram/AegisLoop-RS"

[workspace.dependencies]
aegis-proto = { path = "crates/aegis-proto" }
aegis-perception = { path = "crates/aegis-perception" }
aegis-vlm = { path = "crates/aegis-vlm" }
aegis-safety = { path = "crates/aegis-safety" }
aegis-recorder = { path = "crates/aegis-recorder" }
aegis-sim = { path = "crates/aegis-sim" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zenoh = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-rustls", "copy-dylibs", "api-31"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
